<!DOCTYPE html>

<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover">

<meta name="theme-color" content="#f3f6fa">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>SKKU 조경</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #f3f6fa;
}

body {
    margin: 0;
    padding: 0;

    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    background: #f3f6fa;
    color: #172033;

    -webkit-font-smoothing: antialiased;

    transition:
        background-color 0.2s ease,
        color 0.2s ease;
}

.page {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    padding-top:
        max(28px, env(safe-area-inset-top));

    padding-right:
        max(16px, env(safe-area-inset-right));

    padding-bottom:
        max(32px, env(safe-area-inset-bottom));

    padding-left:
        max(16px, env(safe-area-inset-left));
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}

.header {
    position: relative;
    padding: 8px 4px 22px;
}

.title {
    margin: 0;

    font-size: calc(25px * var(--font-scale, 1));
    font-weight: 800;

    letter-spacing: -1.3px;
    line-height: 1.15;

    color: #102a43;

    transition:
        color 0.2s ease,
        font-size 0.15s ease;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
}

.button {
    display: flex;

    align-items: center;
    justify-content: space-between;

    width: 100%;
    min-height: 108px;

    padding: 20px;

    text-decoration: none;

    color: #172033;
    background: #ffffff;

    border: 1px solid #d9e2ec;
    border-radius: 20px;

    box-shadow:
        0 4px 14px rgba(16, 42, 67, 0.07);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;

    -webkit-user-select: none;
    user-select: none;
}

.button-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.icon {
    flex: 0 0 auto;

    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 14px;
    background: #e7f0ff;

    font-size: 23px;

    transition:
        background-color 0.2s ease;
}

.button-text {
    font-size: calc(19px * var(--font-scale, 1));
    font-weight: 750;

    letter-spacing: -0.5px;
    white-space: nowrap;

    transition:
        font-size 0.15s ease;
}

.button-arrow {
    flex: 0 0 auto;

    font-size: 25px;
    color: #9db2c8;

    margin-left: 5px;
}

.button:active {
    transform: scale(0.97);
}

.button:hover {
    box-shadow:
        0 7px 19px rgba(16, 42, 67, 0.11);
}


/* 설정 */

.settings-wrap {
    position: fixed;

    top:
        max(12px, env(safe-area-inset-top));

    right:
        max(14px, env(safe-area-inset-right));

    z-index: 9000;
}

.settings-button {
    width: 38px;
    height: 38px;

    border: 1px solid rgba(157,178,200,.35);
    border-radius: 12px;

    background: rgba(255,255,255,.88);
    color: #52657a;

    font-size: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 14px rgba(16,42,67,.10);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    transition:
        background-color 0.2s ease,
        color 0.2s ease;
}

.settings-button:active {
    transform: scale(.94);
}


/* 설정 메뉴 */

.settings-menu {
    display: none;

    position: absolute;

    top: 45px;
    right: 0;

    width: 190px;

    padding: 7px;

    background: #ffffff;

    border: 1px solid #d9e2ec;
    border-radius: 15px;

    box-shadow:
        0 12px 30px rgba(16,42,67,.16);
}

.settings-menu.show {
    display: block;
}

.theme-option,
.font-size-option {
    width: 100%;

    min-height: 40px;

    border: 0;
    border-radius: 10px;

    background: transparent;
    color: #172033;

    font-size: 14px;
    font-weight: 700;

    text-align: left;

    padding: 0 11px;

    cursor: pointer;
}

.theme-option:active,
.font-size-option:active {
    background: #eef3f8;
}


/* 글자 크기 */

.font-size-panel {
    display: none;

    padding: 5px 11px 10px;
}

.font-size-panel.show {
    display: block;
}

.font-size-labels {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 3px;

    color: #6b7c8f;

    font-size: 11px;
    font-weight: 600;
}

.font-size-range {
    display: block;

    width: 100%;
    height: 24px;

    margin: 0;
    padding: 0;

    cursor: pointer;

    accent-color: #52657a;
}


/* 어두운 화면 */

body.dark-theme,
html.dark-theme {
    background: #18212b;
}

body.dark-theme {
    color: #e9eef3;
}

body.dark-theme .title {
    color: #ffffff;
}

body.dark-theme .button {
    background: #26313d;
    color: #f0f3f6;

    border-color: #3b4856;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);
}

body.dark-theme .icon {
    background: #334150;
}

body.dark-theme .button-arrow {
    color: #8fa3b8;
}

body.dark-theme .settings-button {
    background: rgba(38,49,61,.94);
    color: #e9eef3;

    border-color: rgba(255,255,255,.12);
}

body.dark-theme .settings-menu {
    background: #26313d;
    border-color: #3b4856;
}

body.dark-theme .theme-option,
body.dark-theme .font-size-option {
    color: #f0f3f6;
}

body.dark-theme .theme-option:active,
body.dark-theme .font-size-option:active {
    background: #334150;
}

body.dark-theme .font-size-labels {
    color: #aebdcc;
}

body.dark-theme .font-size-range {
    accent-color: #d7e1eb;
}


/* 휴대폰 */

@media (max-width: 430px) {

    .page {
        padding-top:
            max(20px, env(safe-area-inset-top));

        padding-left:
            max(13px, env(safe-area-inset-left));

        padding-right:
            max(13px, env(safe-area-inset-right));
    }

    .header {
        padding-bottom: 17px;
    }

    .title {
        font-size:
            calc(22px * var(--font-scale, 1));
    }

    .settings-button {
        width: 36px;
        height: 36px;

        border-radius: 11px;
        font-size: 17px;
    }

    .settings-menu {
        top: 43px;
    }

    .buttons {
        gap: 9px;
    }

    .button {
        min-height: 94px;

        padding: 14px 12px;
        border-radius: 17px;
    }

    .button-left {
        gap: 9px;
    }

    .icon {
        width: 38px;
        height: 38px;

        border-radius: 11px;

        font-size: 19px;
    }

    .button-text {
        font-size:
            calc(17px * var(--font-scale, 1));
    }

    .button-arrow {
        font-size: 21px;
    }
}


/* 아주 작은 화면 */

@media (max-width: 360px) {

    .title {
        font-size:
            calc(20px * var(--font-scale, 1));
    }

    .button {
        min-height: 88px;
    }

    .button-text {
        font-size:
            calc(15px * var(--font-scale, 1));
    }

    .icon {
        width: 34px;
        height: 34px;

        font-size: 17px;
    }
}

</style>

</head>

<body>

<!-- 화면 설정 -->

<div class="settings-wrap" id="settingsWrap">

```
<button
    type="button"
    class="settings-button"
    id="settingsButton"
    aria-label="화면 설정"
    aria-expanded="false">

    ⚙️

</button>


<div
    class="settings-menu"
    id="settingsMenu">


    <button
        type="button"
        class="theme-option"
        id="lightThemeButton">

        ☀️ 밝게

    </button>


    <button
        type="button"
        class="theme-option"
        id="darkThemeButton">

        🌙 어둡게

    </button>


    <button
        type="button"
        class="font-size-option"
        id="fontSizeButton"
        aria-expanded="false">

        🔠 글자 크기

    </button>


    <div
        class="font-size-panel"
        id="fontSizePanel">

        <div class="font-size-labels">

            <span>작게</span>

            <span id="fontSizeValue">
                100%
            </span>

            <span>크게</span>

        </div>


        <input
            type="range"
            class="font-size-range"
            id="fontSizeRange"
            min="0.80"
            max="1.50"
            step="0.05"
            value="1"
            aria-label="글자 크기 조절">

    </div>


</div>
```

</div>

<!-- 메인 -->

<main class="page">

<div class="container">

<header class="header">

```
<h1 class="title">
    SKKU 조경
</h1>
```

</header>

<section class="buttons">

<!-- 작업 일지 -->

<a
 class="button"
 href="https://docs.google.com/spreadsheets/d/1QQc6U-C3LSp8iZTQ85Uzdh3i-Xvjrqgkn-tlllAQFdY/edit?gid=780802741#gid=780802741"
 target="_top">

```
<div class="button-left">

    <div class="icon">
        📝
    </div>

    <span class="button-text">
        작업 일지
    </span>

</div>

<span class="button-arrow">
    ›
</span>
```

</a>

<!-- 물품 구매 -->

<a
 class="button"
 href="https://docs.google.com/spreadsheets/d/1RKlm49nXuZ3W2zG0VngRQjdMEtggl4tBuVjWSOC3rxI/edit?gid=224685163#gid=224685163"
 target="_top">

```
<div class="button-left">

    <div class="icon">
        🛒
    </div>

    <span class="button-text">
        물품 구매
    </span>

</div>

<span class="button-arrow">
    ›
</span>
```

</a>

</section>

</div>

</main>

<script>

/* 설정 */

const THEME_KEY =
    "skku_jogyeong_theme";

const FONT_SIZE_KEY =
    "skku_jogyeong_font_size";


const settingsButton =
    document.getElementById(
        "settingsButton"
    );

const settingsMenu =
    document.getElementById(
        "settingsMenu"
    );

const settingsWrap =
    document.getElementById(
        "settingsWrap"
    );

const lightThemeButton =
    document.getElementById(
        "lightThemeButton"
    );

const darkThemeButton =
    document.getElementById(
        "darkThemeButton"
    );

const fontSizeButton =
    document.getElementById(
        "fontSizeButton"
    );

const fontSizePanel =
    document.getElementById(
        "fontSizePanel"
    );

const fontSizeRange =
    document.getElementById(
        "fontSizeRange"
    );

const fontSizeValue =
    document.getElementById(
        "fontSizeValue"
    );


/* 테마 적용 */

function applyTheme(theme) {

    const isDark =
        theme === "dark";


    document.body.classList.toggle(
        "dark-theme",
        isDark
    );

    document.documentElement.classList.toggle(
        "dark-theme",
        isDark
    );


    try {

        localStorage.setItem(
            THEME_KEY,
            isDark
                ? "dark"
                : "light"
        );

    } catch (error) {}


    settingsMenu.classList.remove(
        "show"
    );

    fontSizePanel.classList.remove(
        "show"
    );

    fontSizeButton.setAttribute(
        "aria-expanded",
        "false"
    );

    settingsButton.setAttribute(
        "aria-expanded",
        "false"
    );
}


/* 글자 크기 적용 */

function applyFontSize(
    value,
    save = true
) {

    let size =
        Number(value);


    if (!Number.isFinite(size)) {
        size = 1;
    }


    size =
        Math.min(
            1.50,
            Math.max(
                0.80,
                size
            )
        );


    document.documentElement.style.setProperty(
        "--font-scale",
        size
    );


    fontSizeRange.value =
        String(size);


    fontSizeValue.textContent =
        Math.round(
            size * 100
        ) + "%";


    if (save) {

        try {

            localStorage.setItem(
                FONT_SIZE_KEY,
                String(size)
            );

        } catch (error) {}

    }
}


/* 저장된 설정 불러오기 */

function loadSettings() {

    let theme =
        "light";

    let fontSize =
        1;


    try {

        theme =
            localStorage.getItem(
                THEME_KEY
            ) || "light";


        const savedSize =
            localStorage.getItem(
                FONT_SIZE_KEY
            );


        if (
            savedSize !== null
        ) {

            fontSize =
                Number(savedSize);

        }

    } catch (error) {}


    if (theme !== "dark") {
        theme = "light";
    }


    document.body.classList.toggle(
        "dark-theme",
        theme === "dark"
    );

    document.documentElement.classList.toggle(
        "dark-theme",
        theme === "dark"
    );


    applyFontSize(
        fontSize,
        false
    );
}


/* ⚙️ 설정 */

settingsButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        const open =
            settingsMenu.classList.toggle(
                "show"
            );


        settingsButton.setAttribute(
            "aria-expanded",
            open
                ? "true"
                : "false"
        );

    }
);


/* ☀️ 밝게 */

lightThemeButton.addEventListener(
    "click",
    function() {

        applyTheme(
            "light"
        );

    }
);


/* 🌙 어둡게 */

darkThemeButton.addEventListener(
    "click",
    function() {

        applyTheme(
            "dark"
        );

    }
);


/* 🔠 글자 크기 */

fontSizeButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        const open =
            fontSizePanel.classList.toggle(
                "show"
            );


        fontSizeButton.setAttribute(
            "aria-expanded",
            open
                ? "true"
                : "false"
        );

    }
);


/* 글자 크기 슬라이더 */

fontSizeRange.addEventListener(
    "input",
    function() {

        applyFontSize(
            this.value
        );

    }
);


/* 화면 다른 곳을 누르면 닫기 */

document.addEventListener(
    "click",
    function(event) {

        if (
            !settingsWrap.contains(
                event.target
            )
        ) {

            settingsMenu.classList.remove(
                "show"
            );

            fontSizePanel.classList.remove(
                "show"
            );

            settingsButton.setAttribute(
                "aria-expanded",
                "false"
            );

            fontSizeButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);


/* 처음 실행 */

loadSettings();

</script>

</body>
</html>
