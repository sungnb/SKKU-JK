<script>

const THEME_KEY = "skku_jogyeong_theme";
const FONT_SIZE_KEY = "skku_jogyeong_font_size";

const settingsButton =
    document.getElementById("settingsButton");

const settingsMenu =
    document.getElementById("settingsMenu");

const settingsWrap =
    document.getElementById("settingsWrap");

const lightThemeButton =
    document.getElementById("lightThemeButton");

const darkThemeButton =
    document.getElementById("darkThemeButton");

const fontSizeButton =
    document.getElementById("fontSizeButton");

const fontSizePanel =
    document.getElementById("fontSizePanel");

const fontSizeDecrease =
    document.getElementById("fontSizeDecrease");

const fontSizeIncrease =
    document.getElementById("fontSizeIncrease");

const fontSizeValue =
    document.getElementById("fontSizeValue");


function applyTheme(theme) {

    const isDark =
        theme === "dark";

    document.body.classList.toggle(
        "dark-theme",
        isDark
    );

    document.documentElement.classList.toggle(
        "dark-theme",
        isDark
    );

    document.body.classList.toggle(
        "light-theme",
        !isDark
    );

    document.documentElement.classList.toggle(
        "light-theme",
        !isDark
    );

    try {

        localStorage.setItem(
            THEME_KEY,
            isDark ? "dark" : "light"
        );

    } catch (error) {}

    settingsMenu.classList.remove("show");
    fontSizePanel.classList.remove("show");

    settingsButton.setAttribute(
        "aria-expanded",
        "false"
    );

    fontSizeButton.setAttribute(
        "aria-expanded",
        "false"
    );
}


function applyFontSize(value, save = true) {

    let size = Number(value);

    if (!Number.isFinite(size)) {
        size = 1;
    }

    size = Math.min(
        1.50,
        Math.max(
            0.80,
            size
        )
    );

    document.documentElement.style.setProperty(
        "--font-scale",
        size
    );

    fontSizeValue.textContent =
        Math.round(size * 100) + "%";

    if (save) {

        try {

            localStorage.setItem(
                FONT_SIZE_KEY,
                String(size)
            );

        } catch (error) {}

    }
}


function loadSettings() {

    let theme = "light";
    let fontSize = 1;

    try {

        theme =
            localStorage.getItem(
                THEME_KEY
            ) || "light";

        const savedSize =
            localStorage.getItem(
                FONT_SIZE_KEY
            );

        if (savedSize !== null) {
            fontSize = Number(savedSize);
        }

    } catch (error) {}

    if (theme !== "dark") {
        theme = "light";
    }

    document.body.classList.toggle(
        "dark-theme",
        theme === "dark"
    );

    document.documentElement.classList.toggle(
        "dark-theme",
        theme === "dark"
    );

    document.body.classList.toggle(
        "light-theme",
        theme === "light"
    );

    document.documentElement.classList.toggle(
        "light-theme",
        theme === "light"
    );

    applyFontSize(
        fontSize,
        false
    );
}


settingsButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        const open =
            settingsMenu.classList.toggle("show");

        settingsButton.setAttribute(
            "aria-expanded",
            open ? "true" : "false"
        );

    }
);


lightThemeButton.addEventListener(
    "click",
    function() {

        applyTheme("light");

    }
);


darkThemeButton.addEventListener(
    "click",
    function() {

        applyTheme("dark");

    }
);


fontSizeButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        const open =
            fontSizePanel.classList.toggle("show");

        fontSizeButton.setAttribute(
            "aria-expanded",
            open ? "true" : "false"
        );

    }
);


/* 글자 크기 5% 감소 */
fontSizeDecrease.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        const current =
            Number(
                getComputedStyle(
                    document.documentElement
                ).getPropertyValue(
                    "--font-scale"
                )
            ) || 1;

        const next =
            Math.max(
                0.80,
                Math.round(
                    (current - 0.05) * 100
                ) / 100
            );

        applyFontSize(next);

    }
);


/* 글자 크기 5% 증가 */
fontSizeIncrease.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        const current =
            Number(
                getComputedStyle(
                    document.documentElement
                ).getPropertyValue(
                    "--font-scale"
                )
            ) || 1;

        const next =
            Math.min(
                1.50,
                Math.round(
                    (current + 0.05) * 100
                ) / 100
            );

        applyFontSize(next);

    }
);


document.addEventListener(
    "click",
    function(event) {

        if (
            !settingsWrap.contains(
                event.target
            )
        ) {

            settingsMenu.classList.remove(
                "show"
            );

            fontSizePanel.classList.remove(
                "show"
            );

            settingsButton.setAttribute(
                "aria-expanded",
                "false"
            );

            fontSizeButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);


loadSettings();

</script>

</body>
</html>
