<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SKKU 조경</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans KR", sans-serif;
      background: #f4f7f5;
      color: #333;
      transition: background 0.25s, color 0.25s;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 22px 16px 40px;
    }

    /* 상단 제목 + 밝게/어둡게 */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 8px 0 30px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 700;
      color: #3f7f4a;
    }

    .theme-buttons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .theme-button {
      border: none;
      background: transparent;
      padding: 2px 3px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 메뉴 */
    .menu {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 68px;

      border: none;
      border-radius: 15px;

      background: #fff;
      color: #333;

      font-size: 21px;
      font-weight: 600;

      text-decoration: none;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.10);

      transition: transform 0.15s,
                  background 0.25s,
                  color 0.25s;
    }

    .menu-button:active {
      transform: scale(0.97);
    }

    /* 어두운 화면 */
    body.dark {
      background: #202522;
      color: #eee;
    }

    body.dark h1 {
      color: #8fca98;
    }

    body.dark .theme-button {
      color: #ccc;
    }

    body.dark .menu-button {
      background: #303632;
      color: #eee;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.30);
    }

    /* 휴대폰 */
    @media (max-width: 480px) {

      .container {
        padding: 20px 14px 30px;
      }

      .header {
        gap: 9px;
        margin-bottom: 26px;
      }

      h1 {
        font-size: 27px;
      }

      .theme-button {
        font-size: 11px;
        padding: 2px;
      }

      .menu-button {
        height: 64px;
        font-size: 20px;
        border-radius: 14px;
      }
    }
  </style>

</head>

<body>

  <div class="container">

```
<!-- 상단 -->
<div class="header">

  <h1>SKKU 조경</h1>

  <div class="theme-buttons">

    <button
      class="theme-button"
      onclick="setLight()">
      ☀ 밝게
    </button>

    <button
      class="theme-button"
      onclick="setDark()">
      🌙 어둡게
    </button>

  </div>

</div>


<!-- 메뉴 -->
<div class="menu">

  <!-- 작업 일지 -->
  <a
    class="menu-button"
    href="https://docs.google.com/spreadsheets/d/1QQc6U-C3LSp8iZTQ85Uzdh3i-Xvjrqgkn-tlllAQFdY/edit?gid=780802741#gid=780802741"
    target="_blank"
    rel="noopener noreferrer">
    작업 일지
  </a>


  <!-- 물품 구매 -->
  <a
    class="menu-button"
    href="https://docs.google.com/spreadsheets/d/1RKlm49nXuZ3W2zG0VngRQjdMEtggl4tBuVjWSOC3rxI/edit?gid=224685163#gid=224685163"
    target="_blank"
    rel="noopener noreferrer">
    물품 구매
  </a>

</div>
```

  </div>

  <script>

    function setLight() {
      document.body.classList.remove("dark");
      localStorage.setItem("theme", "light");
    }

    function setDark() {
      document.body.classList.add("dark");
      localStorage.setItem("theme", "dark");
    }

    // 마지막으로 선택한 화면 기억
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
      document.body.classList.add("dark");
    }

  </script>

</body>
</html>
