<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SKKU 조정</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7f5;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* 제목 */
    h1 {
      margin: 8px 0 28px;
      text-align: center;
      color: #3f7f4a;
      font-size: 30px;
      font-weight: 700;
    }

    /* 메인 메뉴 */
    .main-menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .main-button {
      width: 100%;
      height: 68px;

      border: none;
      border-radius: 15px;

      background: white;
      color: #333;

      font-size: 21px;
      font-weight: 600;

      box-shadow: 0 3px 10px rgba(0,0,0,0.10);

      cursor: pointer;
    }

    .main-button:active {
      transform: scale(0.98);
      background: #edf5ef;
    }

    /* 자료 화면 */
    #dataScreen {
      display: none;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .back-button {
      border: none;
      background: none;
      color: #3f7f4a;
      font-size: 16px;
      font-weight: 600;
      padding: 5px 0;
      cursor: pointer;
    }

    .screen-title {
      margin: 0;
      font-size: 24px;
      color: #333;
    }

    /* 새 자료 버튼 */
    .add-button {
      width: 100%;
      height: 54px;

      margin-bottom: 18px;

      border: none;
      border-radius: 13px;

      background: #3f7f4a;
      color: white;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }

    .add-button:active {
      transform: scale(0.98);
    }

    /* 입력 화면 */
    #inputArea {
      display: none;

      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 20px;

      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .input-title {
      margin: 0 0 15px;
      font-size: 19px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;

      padding: 12px;

      font-family: inherit;
      font-size: 16px;

      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #3f7f4a;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      margin-top: 10px;
    }

    .save-area {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .save-button,
    .cancel-button {
      flex: 1;
      height: 48px;

      border: none;
      border-radius: 10px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    .save-button {
      background: #3f7f4a;
      color: white;
    }

    .cancel-button {
      background: #e9e9e9;
      color: #444;
    }

    /* 자료 목록 */
    #dataList {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .data-card {
      background: white;
      border-radius: 14px;
      padding: 16px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .data-date {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .data-content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 16px;
      line-height: 1.55;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }

    @media (max-width: 480px) {

      .container {
        padding: 18px 14px 30px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 24px;
      }

      .main-button {
        height: 64px;
        font-size: 20px;
      }

      .screen-title {
        font-size: 22px;
      }
    }
  </style>

</head>

<body>

<div class="container">

  <!-- 메인 화면 -->

  <div id="homeScreen">

```
<h1>SKKU 조정</h1>

<div class="main-menu">

  <button
    class="main-button"
    onclick="openSheet('work')">
    작업 일지
  </button>

  <button
    class="main-button"
    onclick="openSheet('purchase')">
    물품 구매
  </button>

</div>
```

  </div>

  <!-- 자료 화면 -->

  <div id="dataScreen">

```
<div class="top-bar">

  <button
    class="back-button"
    onclick="goHome()">
    ← 홈으로
  </button>

  <h2
    id="screenTitle"
    class="screen-title">
    작업 일지
  </h2>

  <div style="width:60px;"></div>

</div>


<!-- 새 자료 입력 -->
<button
  class="add-button"
  onclick="showInput()">
  ＋ 새 자료 입력
</button>


<div id="inputArea">

  <h3 class="input-title">
    새 자료 입력
  </h3>

  <input
    id="inputDate"
    type="date">

  <textarea
    id="inputText"
    placeholder="내용을 입력하세요"></textarea>

  <div class="save-area">

    <button
      class="save-button"
      onclick="saveData()">
      저장
    </button>

    <button
      class="cancel-button"
      onclick="hideInput()">
      취소
    </button>

  </div>

</div>


<!-- 자료 목록 -->
<div id="dataList">
  <div class="loading">
    자료를 불러오는 중입니다...
  </div>
</div>
```

  </div>

</div>

<script>

  /*
   * Google Apps Script Web App 주소
   *
   * 나중에 Apps Script를 배포한 후
   * 아래 주소만 변경하면 됩니다.
   */
  const API_URL = "여기에_Google_Apps_Script_웹앱_주소";


  let currentSheet = "";


  // -------------------------
  // 화면 열기
  // -------------------------
  function openSheet(type) {

    currentSheet = type;

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("dataScreen").style.display = "block";

    if (type === "work") {
      document.getElementById("screenTitle").textContent = "작업 일지";
    }

    if (type === "purchase") {
      document.getElementById("screenTitle").textContent = "물품 구매";
    }

    loadData();
  }


  // -------------------------
  // 홈으로
  // -------------------------
  function goHome() {

    document.getElementById("dataScreen").style.display = "none";
    document.getElementById("homeScreen").style.display = "block";

    hideInput();
  }


  // -------------------------
  // 자료 불러오기
  // -------------------------
  async function loadData() {

    const list = document.getElementById("dataList");

    list.innerHTML = `
      <div class="loading">
        자료를 불러오는 중입니다...
      </div>
    `;

    try {

      const response = await fetch(
        API_URL +
        "?action=get&sheet=" +
        encodeURIComponent(currentSheet)
      );

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || "자료를 불러오지 못했습니다.");
      }

      displayData(result.data);

    } catch (error) {

      list.innerHTML = `
        <div class="empty">
          자료를 불러오지 못했습니다.<br><br>
          ${error.message}
        </div>
      `;

    }

  }


  // -------------------------
  // 자료 표시
  // -------------------------
  function displayData(data) {

    const list = document.getElementById("dataList");

    if (!data || data.length === 0) {

      list.innerHTML = `
        <div class="empty">
          등록된 자료가 없습니다.
        </div>
      `;

      return;
    }


    list.innerHTML = "";


    data.forEach(row => {

      const card = document.createElement("div");

      card.className = "data-card";


      const date = document.createElement("div");

      date.className = "data-date";

      date.textContent = row.date || "";


      const content = document.createElement("div");

      content.className = "data-content";

      content.textContent = row.text || "";


      card.appendChild(date);
      card.appendChild(content);

      list.appendChild(card);

    });

  }


  // -------------------------
  // 입력창 표시
  // -------------------------
  function showInput() {

    document.getElementById("inputArea").style.display = "block";

    const today = new Date();

    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");

    document.getElementById("inputDate").value =
      `${yyyy}-${mm}-${dd}`;

    document.getElementById("inputText").focus();

  }


  // -------------------------
  // 입력창 숨기기
  // -------------------------
  function hideInput() {

    document.getElementById("inputArea").style.display = "none";

    document.getElementById("inputText").value = "";

  }


  // -------------------------
  // 자료 저장
  // -------------------------
  async function saveData() {

    const date =
      document.getElementById("inputDate").value;

    const text =
      document.getElementById("inputText").value.trim();


    if (!text) {

      alert("내용을 입력해 주세요.");

      return;

    }


    try {

      const response = await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "add",

          sheet: currentSheet,

          date: date,

          text: text

        })

      });


      const result = await response.json();


      if (!result.success) {

        throw new Error(
          result.message || "저장하지 못했습니다."
        );

      }


      alert("저장되었습니다.");

      hideInput();

      loadData();


    } catch (error) {

      alert(
        "저장 중 오류가 발생했습니다.\n\n" +
        error.message
      );

    }

  }

</script>

</body>
</html>
