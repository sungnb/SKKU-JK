<title>SKKU 조경</title>

<style>

/* ==================================================
   기본
================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #f3f6fa;
}

body {

    padding: 0;

    min-height: 100dvh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,

        "SF Pro Text",

        "Malgun Gothic",
        sans-serif;

    background: #f3f6fa;
    color: #172033;

    -webkit-font-smoothing: antialiased;

    transition:
        background-color 0.2s ease,
        color 0.2s ease;
}


/* ==================================================
   메인
================================================== */

.page {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    padding-top:
        max(28px, env(safe-area-inset-top));

    padding-right:
        max(16px, env(safe-area-inset-right));

    padding-bottom:
        max(32px, env(safe-area-inset-bottom));

    padding-left:
        max(16px, env(safe-area-inset-left));
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}


/* ==================================================
   상단 제목
================================================== */

.header {
    position: relative;

    padding: 8px 4px 22px;
}

.title {
    margin: 0;

    font-size: 25px;
    font-weight: 800;

    letter-spacing: -1.3px;
    line-height: 1.15;

    color: #102a43;

    transition: color 0.2s ease;
}


/* ==================================================
   버튼 영역
================================================== */

.buttons {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}


/* ==================================================
   Google Sheets 버튼
================================================== */

.button {
    display: flex;

    align-items: center;
    justify-content: space-between;

    min-height: 108px;

    padding: 20px;

    text-decoration: none;

    color: #172033;

    background: #ffffff;

    border: 1px solid #d9e2ec;

    border-radius: 20px;

    box-shadow:
        0 4px 14px rgba(16, 42, 67, 0.07);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;

    -webkit-user-select: none;
    user-select: none;
}

.button-left {
    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;
}

.icon {
    flex: 0 0 auto;

    width: 46px;
    height: 46px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background: #e7f0ff;

    font-size: 23px;

    transition:
        background-color 0.2s ease;
}

.button-text {
    font-size: 19px;
    font-weight: 750;

    letter-spacing: -0.5px;

    white-space: nowrap;
}

.button-arrow {
    flex: 0 0 auto;

    font-size: 25px;

    color: #9db2c8;

    margin-left: 5px;
}


/* ==================================================
   터치 효과
================================================== */

.button:active {
    transform: scale(0.97);
}

.button:hover {
    box-shadow:
        0 7px 19px rgba(16, 42, 67, 0.11);
}


/* ==================================================
   화면 설정
   - 평소에는 ⚙️만 표시
   - 누르면 밝게/어둡게 표시
================================================== */

.settings-wrap {
    position: fixed;

    top:
        max(12px, env(safe-area-inset-top));

    right:
        max(14px, env(safe-area-inset-right));

    z-index: 9000;
}

.settings-button {
    width: 38px;
    height: 38px;

    border: 1px solid rgba(157,178,200,.35);

    border-radius: 12px;

    background: rgba(255,255,255,.88);

    color: #52657a;

    font-size: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 14px rgba(16,42,67,.10);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    transition:
        background-color 0.2s ease,
        color 0.2s ease;
}

.settings-button:active {
    transform: scale(.94);
}


/* ==================================================
   밝게 / 어둡게 메뉴
================================================== */

.settings-menu {
    display: none;

    position: absolute;

    top: 45px;
    right: 0;

    width: 150px;

    padding: 7px;

    background: #ffffff;

    border: 1px solid #d9e2ec;

    border-radius: 15px;

    box-shadow:
        0 12px 30px rgba(16,42,67,.16);
}

.settings-menu.show {
    display: block;
}

.theme-option {
    width: 100%;

    min-height: 40px;

    border: 0;

    border-radius: 10px;

    background: transparent;

    color: #172033;

    font-size: 14px;
    font-weight: 700;

    text-align: left;

    padding: 0 11px;

    cursor: pointer;
}

.theme-option:active {
    background: #eef3f8;
}


/* ==================================================
   어두운 화면
================================================== */

body.dark-theme,
html.dark-theme {
    background: #18212b;
}

body.dark-theme {
    color: #e9eef3;
}


/* 제목 */

body.dark-theme .title {
    color: #ffffff;
}


/* Google Sheets 버튼 */

body.dark-theme .button {
    background: #26313d;

    color: #f0f3f6;

    border-color: #3b4856;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);
}


/* 아이콘 */

body.dark-theme .icon {
    background: #334150;
}


/* 화살표 */

body.dark-theme .button-arrow {
    color: #8fa3b8;
}


/* 설정 버튼 */

body.dark-theme .settings-button {
    background: rgba(38,49,61,.94);

    color: #e9eef3;

    border-color: rgba(255,255,255,.12);
}


/* 설정 메뉴 */

body.dark-theme .settings-menu {
    background: #26313d;

    border-color: #3b4856;
}

body.dark-theme .theme-option {
    color: #f0f3f6;
}

body.dark-theme .theme-option:active {
    background: #334150;
}


/* ==================================================
   휴대폰
================================================== */

@media (max-width: 430px) {

    .page {
        padding-top:
            max(20px, env(safe-area-inset-top));

            max(13px, env(safe-area-inset-left));

        border-radius: 11px;

        font-size: 19px;
    }

        font-size: 17px;

}

   아주 작은 화면
================================================== */

@media (max-width: 360px) {

    .title {
        font-size: 20px;
    }

    .button {
        min-height: 88px;
    }

    .button-text {
        font-size: 15px;
    }

    .icon {
        width: 34px;
        height: 34px;

        font-size: 17px;
    }

</style>
</head>


<body>


<!-- ==================================================
     화면 설정
================================================== -->

<div class="settings-wrap" id="settingsWrap">

    <button
        type="button"
        class="settings-button"
        id="settingsButton"
        aria-label="화면 설정"
        aria-expanded="false">

        ⚙️

    </button>


    <div
        class="settings-menu"
        id="settingsMenu">

        <button
            type="button"
            class="theme-option"
            id="lightThemeButton">

            ☀️ 밝게

        </button>


        <button
            type="button"
            class="theme-option"
            id="darkThemeButton">

            🌙 어둡게

        </button>

    </div>

</div>



<!-- ==================================================
     메인
================================================== -->

<main class="page">

<div class="container">


<header class="header">

    <h1 class="title">
        SKKU 조경
    </h1>

</header>



<!-- ==================================================
     두 개의 Google Sheets
================================================== -->

<section class="buttons">


<!-- 작업 일지 -->

<a
    class="button"
    href="https://docs.google.com/spreadsheets/d/1QQc6U-C3LSp8iZTQ85Uzdh3i-Xvjrqgkn-tlllAQFdY/edit?gid=780802741#gid=780802741"
    target="_top">

    <div class="button-left">

        <div class="icon">
            📝
        </div>

        <span class="button-text">
            작업 일지
        </span>

    </div>

    <span class="button-arrow">
        ›
    </span>

</a>



<!-- 물품 구매 -->

<a
    class="button"
    href="https://docs.google.com/spreadsheets/d/1RKlm49nXuZ3W2zG0VngRQjdMEtggl4tBuVjWSOC3rxI/edit?gid=224685163#gid=224685163"
    target="_top">

    <div class="button-left">

        <div class="icon">
            🛒
        </div>

        <span class="button-text">
            물품 구매
        </span>

    </div>

    <span class="button-arrow">
        ›
    </span>

</a>


</section>

</div>

</main>



<script>

/* ==================================================
   밝게 / 어둡게 설정
================================================== */

const THEME_KEY = "skku_jogyeong_theme";


const settingsButton =
    document.getElementById("settingsButton");

const settingsMenu =
    document.getElementById("settingsMenu");

const settingsWrap =
    document.getElementById("settingsWrap");

const lightThemeButton =
    document.getElementById("lightThemeButton");

const darkThemeButton =
    document.getElementById("darkThemeButton");


/* ==================================================
   테마 적용
================================================== */

function applyTheme(theme) {

    const isDark = theme === "dark";

    document.body.classList.toggle(
        "dark-theme",
        isDark
    );

    document.documentElement.classList.toggle(
        "dark-theme",
        isDark
    );


    try {

        localStorage.setItem(
            THEME_KEY,
            isDark ? "dark" : "light"
        );

    } catch (error) {}


    /* 선택 후 메뉴 닫기 */

    settingsMenu.classList.remove("show");

    settingsButton.setAttribute(
        "aria-expanded",
        "false"
    );
}


/* ==================================================
   저장된 테마 불러오기
================================================== */

function loadTheme() {

    let theme = "light";

    try {

        theme =
            localStorage.getItem(THEME_KEY)
            || "light";

    } catch (error) {}


    applyTheme(theme);
}


/* ==================================================
   ⚙️ 설정 버튼
================================================== */

settingsButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        const open =
            settingsMenu.classList.toggle("show");

        settingsButton.setAttribute(
            "aria-expanded",
            open ? "true" : "false"
        );

    }
);


/* ==================================================
   ☀️ 밝게
================================================== */

lightThemeButton.addEventListener(
    "click",
    function() {

        applyTheme("light");

    }
);


/* ==================================================
   🌙 어둡게
================================================== */

darkThemeButton.addEventListener(
    "click",
    function() {

        applyTheme("dark");

    }
);


/* ==================================================
   화면 다른 곳을 누르면 설정 메뉴 닫기
================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !settingsWrap.contains(event.target)
        ) {

            settingsMenu.classList.remove("show");

            settingsButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);


/* ==================================================
   처음 실행
================================================== */

loadTheme();

</script>

</body>
</html>
